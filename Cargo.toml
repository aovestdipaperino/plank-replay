[package]
name = "plank-tools"
version = "0.1.0"
edition = "2024"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
description = "Tools for plank repro files: replay their file edits, summarise and browse sessions"
repository = "https://github.com/aovestdipaperino/plank-tools"
license = "MIT"

[[bin]]
name = "pt"
path = "src/main.rs"

[dependencies]
# plank's local inference crate, linked in-process: its build script compiles
# the ds4 C engine from plank's refs/ds4. Expects plank checked out beside this
# repo. Gemma support is left off: activation capture is ds4-only, and the
# Gemma backend would pull in candle for nothing.
local-inference-engine = { path = "../plank/crates/local-inference-engine", default-features = false }
# plank's user files (vectors.json, installed profiles), shared with plank so
# both read and write them the same way.
plank-lib = { path = "../plank/crates/plank-lib" }
libc = "0.2"
# Dequantizes GGUF tensors and runs the Gram matrices of `pt vectorize --diff`
# (Metal on macOS).
candle-core = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["metal"] }
arboard = "3"
serde_json = "1"

[lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
